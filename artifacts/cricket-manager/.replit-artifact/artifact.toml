kind = "web"
previewPath = "/"
title = "Cricket Manager"
version = "1.0.0"
id = "artifacts/cricket-manager"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 19740
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/cricket-manager run dev"

[services.env]
PORT = "19740"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/cricket-manager", "run", "build"]
publicDir = "artifacts/cricket-manager/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
